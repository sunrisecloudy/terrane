name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Toolchain
        run: rustup show

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --workspace --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  macos:
    name: macOS M-series
    runs-on: macos-15
    timeout-minutes: 180
    env:
      # Public CI-only key. Production releases use the protected repository secret.
      TERRANE_CAP_SIGNING_KEY_HEX: 000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Confirm Apple silicon
        run: test "$(uname -m)" = arm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec host/macos/project.yml

      - name: macOS tests
        run: |
          xcodebuild \
            -quiet \
            -project host/macos/Terrane.xcodeproj \
            -scheme TerraneHostE2ETests \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/TerraneTests" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Unsigned release packaging preflight
        run: |
          scripts/build-macos-release.sh \
            --version 0.2.0 \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output "$RUNNER_TEMP/release-preflight" \
            --unsigned

      - name: Validate preflight manifest
        run: |
          jq -e '
            .version == "0.2.0" and
            .architecture == "arm64" and
            .builtInAppBundleCount == 14 and
            .capabilityBundleCount == 42 and
            .developerIdSigned == false and
            .notarized == false
          ' "$RUNNER_TEMP/release-preflight/release-manifest.json"

      - name: Upload preflight artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-release-preflight
          path: ${{ runner.temp }}/release-preflight/
          retention-days: 7
