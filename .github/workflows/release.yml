name: Release macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to build without publishing
        required: true
        default: "0.2.0"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-15
    timeout-minutes: 240
    environment: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            test "$GITHUB_REF_NAME" = "v$version"
          else
            version="$DISPATCH_VERSION"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "0.2.0"
          test -f "docs/releases/v${version}.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate publish source
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"

      - name: Require production secrets
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          CAPABILITY_KEY: ${{ secrets.TERRANE_CAP_SIGNING_KEY_HEX }}
        run: |
          set -euo pipefail
          for value in \
            "$CERTIFICATE" \
            "$CERTIFICATE_PASSWORD" \
            "$NOTARY_KEY" \
            "$NOTARY_KEY_ID" \
            "$NOTARY_ISSUER_ID" \
            "$CAPABILITY_KEY"; do
            test -n "$value"
          done

      - name: Confirm Apple silicon
        run: test "$(uname -m)" = arm64

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: scripts/ci-import-macos-certificate.sh

      - name: Prepare App Store Connect API key
        env:
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$APPLE_NOTARY_KEY_P8_BASE64" |
            base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Source verification
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build, sign, and notarize
        env:
          TERRANE_CAP_SIGNING_KEY_HEX: ${{ secrets.TERRANE_CAP_SIGNING_KEY_HEX }}
          APPLE_NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/build-macos-release.sh \
            --version "${{ steps.version.outputs.version }}" \
            --build-number "$GITHUB_RUN_NUMBER" \
            --output artifacts/macos \
            --notarize

      - name: Verify final end-user artifact
        run: |
          scripts/verify-macos-release.sh \
            "artifacts/macos/Terrane-${{ steps.version.outputs.version }}-macos-arm64.dmg" \
            "${{ steps.version.outputs.version }}"
          shasum -a 256 -c artifacts/macos/SHA256SUMS
          jq -e '
            .developerIdSigned == true and
            .notarized == true and
            .architecture == "arm64" and
            .builtInAppBundleCount == 14 and
            .capabilityBundleCount == 42
          ' artifacts/macos/release-manifest.json

      - name: Attest release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: artifacts/macos/Terrane-${{ steps.version.outputs.version }}-macos-arm64.dmg

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Terrane-${{ steps.version.outputs.version }}-macos-arm64
          path: artifacts/macos/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "v$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Terrane v$VERSION" \
            --notes-file "docs/releases/v${VERSION}.md" \
            "artifacts/macos/Terrane-${VERSION}-macos-arm64.dmg" \
            "artifacts/macos/SHA256SUMS" \
            "artifacts/macos/release-manifest.json"
