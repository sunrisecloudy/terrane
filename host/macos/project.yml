# XcodeGen spec — generates Terrane.xcodeproj (gitignored; regenerate with
# `xcodegen generate`). The macOS host: an AppKit + WKWebView app that links the
# Rust staticlib libterrane_host.a (built by the pre-build phase below).
name: Terrane
options:
  bundleIdPrefix: com.terrane
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "YES"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: "NO"
targets:
  TerraneHost:
    type: application
    platform: macOS
    supportedDestinations:
      - macOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrane.host
        DEAD_CODE_STRIPPING: "YES"
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../target/macos-static/release
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host.a
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host_httplib.a
          - -lc++
          - -liconv
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TerraneHost-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/TerraneHost.entitlements
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../rust/crates/terrane-host/include
    info:
      path: Sources/Info.plist
      properties:
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSCameraUsageDescription: "Photobooth uses the camera only when you start the camera and take a picture."
        NSMicrophoneUsageDescription: "Terrane transcribes speech locally when you enable the microphone for ambient dictation."
        CFBundleName: Terrane
        CFBundleURLTypes:
          - CFBundleURLName: com.terrane.host.deep-links
            CFBundleURLSchemes:
              - terrane
        CFBundleDocumentTypes:
          - CFBundleTypeName: Terrane Text Import
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            CFBundleTypeExtensions:
              - txt
        NSServices:
          - NSMenuItem:
              default: Send to Terrane
            NSMessage: openFiles
            NSPortName: Terrane
            NSSendFileTypes:
              - public.data
        LSUIElement: false
    dependencies:
      - sdk: WebKit.framework
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: CoreLocation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: "Build terrane-host (Rust staticlib)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host.a
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host_httplib.a
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CARGO_TARGET_DIR="$SRCROOT/../../target/macos-static"
          export CMAKE_TOOLCHAIN_FILE="$SRCROOT/cmake/static-host.cmake"
          cd "$SRCROOT/../.."
          cargo build -p terrane-host -p terrane-host-web --release
          HTTP_ARCHIVE="$(find "$CARGO_TARGET_DIR/release/build" -path '*/out/build/vendor/cpp-httplib/libcpp-httplib.a' -type f -print | sort | tail -n 1)"
          if [ -z "$HTTP_ARCHIVE" ]; then
            echo "llama-cpp-sys did not produce libcpp-httplib.a" >&2
            exit 1
          fi
          cp "$HTTP_ARCHIVE" "$CARGO_TARGET_DIR/release/libterrane_host_httplib.a"
    postBuildScripts:
      - name: "Package built-in apps"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          APP_SOURCE="$SRCROOT/../../apps"
          APP_DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/apps"
          if [ ! -d "$APP_SOURCE" ]; then
            echo "Built-in app source directory is missing: $APP_SOURCE" >&2
            exit 1
          fi
          mkdir -p "$APP_DESTINATION"
          rsync -a --delete --exclude '.gitignore' --exclude 'node_modules' \
            "$APP_SOURCE/" "$APP_DESTINATION/"
          SOURCE_COUNT="$(find "$APP_SOURCE" -mindepth 2 -maxdepth 2 -type f -name manifest.json | wc -l | tr -d ' ')"
          DESTINATION_COUNT="$(find "$APP_DESTINATION" -mindepth 2 -maxdepth 2 -type f -name manifest.json | wc -l | tr -d ' ')"
          if [ "$SOURCE_COUNT" -eq 0 ] || [ "$DESTINATION_COUNT" -ne "$SOURCE_COUNT" ]; then
            echo "Built-in app packaging failed: expected $SOURCE_COUNT manifests, found $DESTINATION_COUNT" >&2
            exit 1
          fi
          echo "Embedded $DESTINATION_COUNT built-in app bundles"
      - name: "Package signed native capabilities"
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          CAPABILITY_DESTINATION="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/capabilities"
          if [ -n "${TERRANE_CAP_BUNDLE_DIR:-}" ]; then
            if [ ! -f "$TERRANE_CAP_BUNDLE_DIR/index.json" ] || \
               [ ! -f "$TERRANE_CAP_BUNDLE_DIR/verifying-key.hex" ]; then
              echo "Invalid native capability bundle directory: missing index or verifying key" >&2
              exit 1
            fi
            BUNDLE_COUNT="$(find "$TERRANE_CAP_BUNDLE_DIR" -maxdepth 1 -type f -name '*.tcap' | wc -l | tr -d ' ')"
            if [ "$BUNDLE_COUNT" -ne 41 ]; then
              echo "Invalid native capability bundle directory: expected 41 .tcap files, found $BUNDLE_COUNT" >&2
              exit 1
            fi
            mkdir -p "$CAPABILITY_DESTINATION"
            rsync -a --delete "$TERRANE_CAP_BUNDLE_DIR/" "$CAPABILITY_DESTINATION/"
            echo "Embedded 41 prebuilt signed native capabilities from $TERRANE_CAP_BUNDLE_DIR"
            exit 0
          fi
          if [ -z "${TERRANE_CAP_SIGNING_KEY_HEX:-}" ]; then
            echo "Skipping native capabilities: neither TERRANE_CAP_BUNDLE_DIR nor TERRANE_CAP_SIGNING_KEY_HEX is set"
            exit 0
          fi
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          "$SRCROOT/../../scripts/package-native-capabilities.sh" \
            "$CAPABILITY_DESTINATION"
  TerraneHostE2ETests:
    type: bundle.unit-test
    platform: macOS
    supportedDestinations:
      - macOS
    sources:
      - path: Tests
      - path: Sources/AppCatalog.swift
      - path: Sources/AppSchemeHandler.swift
      - path: Sources/HomePage.swift
      - path: Sources/TerraneBridge.swift
      - path: Sources/PreviewSchemeHandler.swift
      - path: Sources/AppSidebarView.swift
      - path: Sources/LocalModelPanel.swift
      - path: Sources/LoopbackAppHost.swift
      - path: Sources/NativeCameraCapture.swift
      - path: Sources/NativeCameraFrameStreamer.swift
      - path: Sources/SourceEditor.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.terrane.host.e2e-tests
        DEAD_CODE_STRIPPING: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../target/macos-static/release
        OTHER_LDFLAGS:
          - $(inherited)
          - -force_load
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host.a
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host_httplib.a
          - -lc++
          - -liconv
        SWIFT_OBJC_BRIDGING_HEADER: Sources/TerraneHost-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Sources/TerraneHost.entitlements
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../../rust/crates/terrane-host/include
    dependencies:
      - sdk: WebKit.framework
      - sdk: AppKit.framework
      - sdk: AVFoundation.framework
      - sdk: Accelerate.framework
      - sdk: CoreLocation.framework
      - sdk: IOKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
    preBuildScripts:
      - name: "Build terrane-host (Rust staticlib)"
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host.a
          - $(SRCROOT)/../../target/macos-static/release/libterrane_host_httplib.a
        script: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          export CARGO_TARGET_DIR="$SRCROOT/../../target/macos-static"
          export CMAKE_TOOLCHAIN_FILE="$SRCROOT/cmake/static-host.cmake"
          cd "$SRCROOT/../.."
          cargo build -p terrane-host -p terrane-host-web --release
          HTTP_ARCHIVE="$(find "$CARGO_TARGET_DIR/release/build" -path '*/out/build/vendor/cpp-httplib/libcpp-httplib.a' -type f -print | sort | tail -n 1)"
          if [ -z "$HTTP_ARCHIVE" ]; then
            echo "llama-cpp-sys did not produce libcpp-httplib.a" >&2
            exit 1
          fi
          cp "$HTTP_ARCHIVE" "$CARGO_TARGET_DIR/release/libterrane_host_httplib.a"
schemes:
  TerraneHost:
    build:
      targets:
        TerraneHost: all
    run:
      config: Debug
      executable: TerraneHost
    profile:
      config: Release
      executable: TerraneHost
    analyze:
      config: Debug
    archive:
      config: Release
  TerraneHostE2ETests:
    build:
      targets:
        TerraneHostE2ETests: all
    test:
      config: Debug
      targets:
        - TerraneHostE2ETests
